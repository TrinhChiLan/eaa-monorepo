[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eaa-backend-modules"
version = "0.1.0"
description = "EAA edge backend slice: multi-protocol router, telemetry ring buffer, SQLite persistence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "pyzmq>=26,<28",
    "aiosqlite>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
eaa-orchestrator = "event_pipeline.main_nvhn:cli"
eaa-mock-feed = "event_pipeline.tests.mock.feed:cli"

[tool.setuptools]
package-dir = { "" = "src" }
# Only the event pipeline is packaged from this branch; the event_pipeline
# package __init__ keeps its internal flat imports resolvable.
packages = [
    "event_pipeline",
    "event_pipeline.db_client",
    "event_pipeline.event_router",
    "event_pipeline.mock_data",
    "event_pipeline.mock_data.constants",
    "event_pipeline.mock_data.schemas",
    "event_pipeline.telemetry_ring",
    "event_pipeline.tests",
    "event_pipeline.tests.mock",
    "event_pipeline.tests.unit_tests",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["src/event_pipeline/tests/unit_tests", "src/control_pipeline/tests"]
pythonpath = ["src", "src/event_pipeline", "src/control_pipeline"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
