[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eaa-backend-modules"
version = "0.1.0"
description = "EAA edge backend slice: multi-protocol router, telemetry ring buffer, SQLite persistence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "pyzmq>=26,<28",
    "aiosqlite>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
eaa-orchestrator = "eaa_orchestrator.main:cli"
eaa-mock-feed = "mocks.feed:cli"

[tool.setuptools]
package-dir = { "" = ".", "eaa_orchestrator" = "container-orchestrator/src/eaa_orchestrator" }
packages = [
    "shared",
    "shared.schemas",
    "shared.constants",
    "eaa_orchestrator",
    "eaa_orchestrator.router",
    "eaa_orchestrator.telemetry",
    "eaa_orchestrator.persistence",
    "mocks",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
